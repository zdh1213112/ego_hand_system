schema_version: 3

experiment:
  name: glove_lora_stage2

paths:
  dataset_root: datasets/0827_sl
  checkpoint: pretrained_models/wilor_final.ckpt
  model_config: pretrained_models/model_config.yaml
  mano_path: mano_data/mano_v1_2
  output: output/glove_lora_stage2
  train_manifest: null
  val_manifest: null
  resume: null
  init_weights: output/opentouch_lora_stage1/best_trainable.pt

data:
  type: glove_camera
  image_size: 256
  rescale_factor: 2.0
  npz_cache_size: 8

recipe:
  type: refiner_finetune
  vit_tuning: null
  lora: null

training:
  max_steps: 2000
  batch_size: 16
  num_workers: 4
  seed: 42
  device: cuda:0
  amp: true
  max_train_samples: null
  gradient_accumulation_steps: 4

optimization:
  vit_lr: 0.0
  pose_head_lr: 0.0
  coarse_lr: 0.0001
  refiner_lr: 0.00001
  weight_decay: 0.0001
  grad_clip: 1.0

checkpointing:
  save_steps: 50

validation:
  val_steps: 50
  max_batches: null
  batch_size: 16
  max_samples: null
  final_visualization: true

losses:
  local_keypoints_3d: 0.0
  keypoints_2d: 0.01
  keypoints_3d: 0.05
  coarse_keypoints_2d: 0.005
  coarse_keypoints_3d: 0.025
  global_orient: 0.001
  hand_pose: 0.001
  betas: 0.0005
