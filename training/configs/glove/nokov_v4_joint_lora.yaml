schema_version: 3
experiment:
  name: glove_v4_bs64_30000_20261123
paths:
  # Relative paths use the training/ directory as their base.
  dataset_root: datasets/glove_trainset_20261123_v4
  checkpoint: ../models/wilor/coarse_start.ckpt
  model_config: pretrained_models/model_config.yaml
  mano_path: ../models/mano
  output: output/glove_v4_joint_lora
  resume: null
  init_weights: null
data:
  type: glove_camera
  image_size: 256
  rescale_factor: 2.0
  npz_cache_size: 8
  marker_inputs: {}
recipe:
  type: joint_lora_finetune
  vit_tuning: lora
  camera_model: physical_kb
  lora:
    blocks: all
    targets:
    - attn.qkv
    - attn.proj
    rank: 4
    alpha: 8.0
    dropout: 0.05
training:
  max_steps: 30000
  batch_size: 64
  num_workers: 8
  seed: 42
  device: cuda:0
  amp: true
  max_train_samples: null
  gradient_accumulation_steps: 1
optimization:
  vit_lr: 1.0e-05
  pose_head_lr: 0.0
  coarse_lr: 1.0e-05
  refiner_lr: 1.0e-05
  camera_lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
checkpointing:
  save_steps: 100
validation:
  val_steps: 700
  max_batches: null
  batch_size: 64
  max_samples: null
  final_visualization: true
losses:
  local_keypoints_3d: 0.0
  keypoints_2d: 0.01
  keypoints_3d: 0.05
  coarse_keypoints_2d: 0.005
  coarse_keypoints_3d: 0.025
  global_orient: 0.001
  hand_pose: 0.001
  betas: 0.0005
  physical_root_3d: 0.5
