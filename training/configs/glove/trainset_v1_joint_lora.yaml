optimization:
  vit_lr: 1.0e-05
  pose_head_lr: 0.0
  coarse_lr: 1.0e-05
  refiner_lr: 1.0e-05
  weight_decay: 0.0001
  grad_clip: 1.0
  camera_lr: 0.0003
checkpointing:
  save_steps: 100
validation:
  val_steps: 100
  max_batches: null
  batch_size: 4
  max_samples: null
  final_visualization: true
losses:
  local_keypoints_3d: 0.0
  keypoints_2d: 0.01
  keypoints_3d: 0.05
  coarse_keypoints_2d: 0.005
  coarse_keypoints_3d: 0.025
  global_orient: 0.001
  hand_pose: 0.001
  betas: 0.0005
  physical_root_3d: 0.5
