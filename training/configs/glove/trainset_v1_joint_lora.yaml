# Latest prepared native KB labels: datasets/trainset_v1 (2026-11-14).
# Preserves output/trainset_v1_full.yaml settings; writes to a fresh directory.
schema_version: 3
experiment:
  name: joint_refit_192916_191855
paths:
  dataset_root: datasets/trainset_v1
  checkpoint: output/native_kb_training_20261111/coarse_start.ckpt
  model_config: pretrained_models/model_config.yaml
  mano_path: mano_data/mano_v1_2
  output: output/trainset_v1_joint_lora
  train_manifest: null
  val_manifest: null
  resume: null
  init_weights: null
data:
  type: glove_camera
  image_size: 256
  rescale_factor: 2.0
  npz_cache_size: 8
recipe:
  type: joint_lora_finetune
  vit_tuning: lora
  lora:
    blocks: all
    targets:
    - attn.qkv
    - attn.proj
    rank: 4
    alpha: 8.0
    dropout: 0.05
