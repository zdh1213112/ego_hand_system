schema_version: 3

experiment:
  name: opentouch_hf_domain_adapt

paths:
  dataset_root: datasets/opentoch_hf/training
  checkpoint: pretrained_models/wilor_final.ckpt
  model_config: pretrained_models/model_config.yaml
  mano_path: mano_data/mano_v1_2
  output: output/opentouch_hf_domain_adapt
  train_manifest: null
  val_manifest: null
  resume: null
  init_weights: null

data:
  type: opentouch
  image_size: 256
  rescale_factor: 2.0
  npz_cache_size: 8

recipe:
  type: domain_adapt
  vit_tuning: lora
  lora:
    blocks: all
    targets: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
    rank: 16
    alpha: 32.0
    dropout: 0.05

training:
  max_steps: 5000
  batch_size: 16
  num_workers: 8
  seed: 42
  device: cuda:0
  amp: true
  max_train_samples: null
  gradient_accumulation_steps: 1

optimization:
  vit_lr: 0.0001
  pose_head_lr: 0.0
  coarse_lr: 0.0
  refiner_lr: 0.0
  weight_decay: 0.0001
  grad_clip: 1.0

checkpointing:
  save_steps: 100

validation:
  val_steps: 100
  max_batches: null
  batch_size: 16
  max_samples: null
  final_visualization: false

losses:
  local_keypoints_3d: 1.0
  keypoints_2d: 0.0
  keypoints_3d: 0.0
  coarse_keypoints_2d: 0.0
  coarse_keypoints_3d: 0.0
  global_orient: 0.0
  hand_pose: 0.0
  betas: 0.0
