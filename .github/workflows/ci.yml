name: CI
on:
  push:
    branches: [main, feature/ego-hand-inference]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          pip install numpy==2.2.6 PyYAML pytest ruff opencv-python-headless av==14.2.0 mcap==1.2.2 mcap-protobuf-support==0.5.3
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 scripts tests
      - name: Test portable input, geometry and delivery
        run: |
          pytest -q tests/test_normalize_orbbec_ego4_session.py tests/test_orbbec_mcap.py tests/test_shared_hand_geometry.py tests/test_hand_delivery.py tests/test_raw_detector_overlay.py tests/test_shared_skeleton_clipping.py tests/test_shared_mesh_rendering.py
