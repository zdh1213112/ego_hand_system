name: ego-hand
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - mcap==1.2.2
      - mcap-protobuf-support==0.5.3
      - av==14.2.0
      - protobuf>=4.25,<6
      - zstandard>=0.22,<1
      - lz4>=4.3,<5
      - mediapipe==0.10.35
      - opencv-contrib-python==5.0.0.93
      - numpy==2.2.6
      - PyYAML==6.0.3
      - python-dateutil==2.9.0.post0
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - scipy==1.15.3
      - trimesh==4.7.4
      # chumpy 0.71 is not available as a usable PyPI wheel for this setup.
      # PIP_NO_BUILD_ISOLATION below makes this equivalent to:
      # pip install --no-build-isolation git+https://github.com/mattloper/chumpy.git
      - git+https://github.com/mattloper/chumpy.git
      - typeguard==4.4.4
      # WiLoR inference route. Keep torch/numpy/OpenCV governed by the core pins
      # above; do not add WiLoR's upstream opencv-python alongside this project's
      # opencv-contrib-python distribution.
      - pyrender==0.1.45
      - scikit-image==0.25.2
      - pytorch-lightning==2.6.5
      - smplx==0.1.28
      - yacs==0.1.8
      - timm==1.0.28
      - einops==0.8.2
      - xtcocotools==1.14.3
      - pandas==2.3.3
      - hydra-core==1.3.5
      - hydra-submitit-launcher==1.2.0
      - hydra-colorlog==1.2.0
      - pyrootutils==1.0.4
      - rich==15.0.0
      - webdataset==1.0.2
      - gradio==6.22.0
      - ultralytics==8.1.34
      - dill==0.4.1
variables:
  PYTHONNOUSERSITE: "1"
  PIP_NO_BUILD_ISOLATION: "1"
