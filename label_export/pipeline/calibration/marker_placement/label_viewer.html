<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原图与 MANO Mesh 标签检查</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#111d29;color:#e6eef5}header{padding:18px 24px;background:#1d3347}h1{font-size:22px;margin:0 0 8px}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px}button,select,input{font:inherit}button,select{padding:8px;border-radius:6px;background:#e5eef5;color:#18334b;border:0;cursor:pointer}label{display:inline-flex;align-items:center;gap:5px}#timeline{flex:1;min-width:180px}.views{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 15px}.panel{background:#070f17;border-radius:8px;overflow:hidden}.panel h2{margin:0;padding:9px 15px;font-size:15px}canvas{width:100%;height:63vh;display:block;touch-action:none;cursor:grab}#status,#help,#meta{padding:8px 20px;line-height:1.6;overflow-wrap:anywhere}#status{color:#8ce1c3}details{padding:0 20px 18px}#empty{color:#ffcc85}a{color:#8bd7ff}@media(max-width:800px){.views{grid-template-columns:1fr}canvas{height:44vh}}</style>
<header><h1>原图与 MANO Mesh 标签检查</h1><div>左侧原图，右侧叠加当前导出的 mesh。两侧同步缩放和平移，图片保持原始畸变。<a href="marker_placement/" id="markerLink">Marker 贴点确认</a></div></header>
<div class="bar"><label>录制 <select id="source"></select></label><label>相机 <select id="camera"></select></label><button id="prev">上一帧 ←</button><button id="next">下一帧 →</button><input type="range" id="timeline" min="0" value="0"><span id="frameText"></span></div>
<div class="bar"><label><input type="checkbox" id="left" checked>左手 · 青色</label><label><input type="checkbox" id="right" checked>右手 · 橙色</label><label>叠加 <select id="mode"><option value="wire">三角网格</option><option value="surface">半透明面</option><option value="points">顶点</option><option value="none">隐藏</option></select></label><label>透明度 <input id="alpha" type="range" min="0" max="1" value="0.55" step="0.05"></label><label><input id="joints" type="checkbox">关节点</label><button id="fit">整幅图</button><button id="fitLeft">放大左手</button><button id="fitRight">放大右手</button><button id="shot">保存叠加截图</button></div>
<div class="views"><section class="panel"><h2>真实相机原图</h2><canvas id="raw"></canvas></section><section class="panel"><h2>相同原图 + 导出标签</h2><canvas id="overlay"></canvas></section></div>
<div id="status" role="status">正在加载…</div><div id="empty"></div>
<div class="bar"><label>此帧检查结果 <select id="rating"><option value="unreviewed">未检查</option><option value="good">贴合较好</option><option value="offset">整体偏移</option><option value="fingers">手指姿态不贴合</option><option value="shape">手型 / 尺度不贴合</option><option value="unclear">遮挡 / 模糊，无法判断</option></select></label><input id="note" placeholder="备注，例如左手食指向外偏" size="35"><button id="saveReview">导出检查记录</button></div>
<div id="help">滚轮以鼠标位置缩放；拖动平移；左右箭头切换已导出的帧；按住空格临时隐藏叠加。未导出的帧不会补插或显示为有效标签。网格线显示全部三角形，包含背面；透明面按深度排序，不能模拟真实手对 mesh 的遮挡。</div>
<details><summary>当前标签与投影信息</summary><pre id="meta"></pre></details>
<script src="data.js"></script><script>
'use strict';const D=window.LABEL_DATA,$=id=>document.getElementById(id),canvases=[$('raw'),$('overlay')];let frames=[],index=0,img=null,token=0,scale=1,ox=0,oy=0,hide=false,drag=null;
const reviewKey='label-review-v1:'+D.dataset;let reviews={};try{reviews=JSON.parse(localStorage.getItem(reviewKey)||'{}')}catch(e){}
function opts(id,values){$(id).replaceChildren(...values.map(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;return o}))}
opts('source',[...new Set(D.frames.map(f=>f.source))]);opts('camera',[...new Set(D.frames.map(f=>f.camera))].sort());
function key(){const f=frames[index];return [f.source,f.camera,f.sync].join('/')}
function selectFrames(keepSync){frames=D.frames.filter(f=>f.source===$('source').value&&f.camera===$('camera').value);index=0;if(keepSync!==undefined&&frames.length)index=frames.reduce((best,f,i)=>Math.abs(f.sync-keepSync)<Math.abs(frames[best].sync-keepSync)?i:best,0);$('timeline').max=Math.max(0,frames.length-1);load()}
function load(){const seq=++token;img=null;draw();if(!frames.length){$('status').textContent='该录制 / 相机没有导出的有效标签';$('frameText').textContent='0 / 0';return}const f=frames[index];$('timeline').value=index;$('frameText').textContent=`${index+1} / ${frames.length} · sync ${f.sync}`;$('status').textContent='正在加载原图…';$('rating').value=reviews[key()]?.rating||'unreviewed';$('note').value=reviews[key()]?.note||'';const image=new Image();image.onload=()=>{if(seq!==token)return;img=image;if(!viewInitialized||!$('keepZoom')?.checked)fit();else draw();viewInitialized=true;$('status').textContent=`${f.source_name} | ${f.camera} | sync ${f.sync} | 原图 ${f.size.join(' × ')} | ${f.hands.length} 只手 | 已导出标签 ${D.label_count} 份`};image.onerror=()=>{if(seq===token)$('status').textContent='原图无法加载，请检查图片链接及源数据是否仍在原路径'};image.src=f.image;$('meta').textContent=JSON.stringify({dataset:D.dataset,projection:D.projection,max_projection_difference_px:D.max_projection_difference_px,...f,hands:f.hands.map(({vertices,joints,...h})=>h)},null,2)}
function resize(){for(const c of canvases){c.width=Math.round(c.clientWidth*devicePixelRatio);c.height=Math.round(c.clientHeight*devicePixelRatio)}if(img)fit();else draw()}
function fit(side){if(!img)return;const c=activeViewCanvas(),w=c.clientWidth,h=c.clientHeight,f=frames[index],hand=f.hands.find(x=>x.side===side);if(side!==undefined&&!hand){$('status').textContent='此帧没有该手的导出标签';return}let b=hand?hand.bbox:[0,0,img.naturalWidth,img.naturalHeight];const bw=Math.max(1,b[2]-b[0]),bh=Math.max(1,b[3]-b[1]);scale=Math.min(w/bw,h/bh)*(hand ? 0.8 : 0.98);ox=w/2-(b[0]+b[2])/2*scale;oy=h/2-(b[1]+b[3])/2*scale;draw()}
function draw(){for(let ci=0;ci<2;ci++){const c=canvases[ci],ctx=c.getContext('2d'),r=devicePixelRatio;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);if(!img)continue;ctx.setTransform(r*scale,0,0,r*scale,r*ox,r*oy);ctx.drawImage(img,0,0);if(!ci||hide)continue;const hands=frames[index].hands.filter(h=>$(h.side?'right':'left').checked),mode=$('mode').value;ctx.globalAlpha=+$('alpha').value;ctx.lineWidth=.7/scale;const triangles=[];
for(const h of hands){const color=h.side?'#ff983b':'#24e2c3';ctx.strokeStyle=color;ctx.fillStyle=color;if(mode==='surface')for(const face of D.faces)triangles.push({p:face.map(i=>h.vertices[i]),color,z:face.reduce((a,i)=>a+h.vertices[i][2],0)/3});else if(mode==='wire'){ctx.beginPath();for(const face of D.faces){const p=face.map(i=>h.vertices[i]);ctx.moveTo(...p[0].slice(0,2));ctx.lineTo(...p[1].slice(0,2));ctx.lineTo(...p[2].slice(0,2));ctx.closePath()}ctx.stroke()}else if(mode==='points'){for(const p of h.vertices)ctx.fillRect(p[0]-1/scale,p[1]-1/scale,2/scale,2/scale)}}
triangles.sort((a,b)=>b.z-a.z);for(const t of triangles){ctx.fillStyle=t.color;ctx.beginPath();ctx.moveTo(...t.p[0].slice(0,2));ctx.lineTo(...t.p[1].slice(0,2));ctx.lineTo(...t.p[2].slice(0,2));ctx.closePath();ctx.fill()}ctx.globalAlpha=1;if($('joints').checked)for(const h of hands){ctx.fillStyle=h.side?'#ff983b':'#24e2c3';for(let j=0;j<h.joints.length;j++){const p=h.joints[j];ctx.beginPath();ctx.arc(p[0],p[1],2.5/scale,0,Math.PI*2);ctx.fill();ctx.font=`${11/scale}px sans-serif`;ctx.fillText(j,p[0]+4/scale,p[1])}}}}
for(const c of canvases){c.onwheel=e=>{e.preventDefault();const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,s=Math.max(.03,Math.min(30,scale*Math.exp(-e.deltaY*.001)));ox=x-(x-ox)*s/scale;oy=y-(y-oy)*s/scale;scale=s;draw()};c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;ox+=e.clientX-drag.x;oy+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};draw()};c.onpointerup=c.onpointercancel=()=>drag=null}
function move(d){if(!frames.length)return;index=Math.max(0,Math.min(frames.length-1,index+d));load()}
$('source').onchange=()=>selectFrames();$('camera').onchange=()=>selectFrames(frames[index]?.sync);$('timeline').oninput=e=>{index=+e.target.value;load()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('fit').onclick=()=>fit();$('fitLeft').onclick=()=>fit(0);$('fitRight').onclick=()=>fit(1);for(const id of ['left','right','mode','alpha','joints'])$(id).oninput=draw;
window.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();hide=true;draw()}if(e.code==='ArrowRight')move(1);if(e.code==='ArrowLeft')move(-1)};window.onkeyup=e=>{if(e.code==='Space'){hide=false;draw()}};window.onblur=()=>{hide=false;drag=null;draw()};
function record(){if(!frames.length)return;reviews[key()]={source:frames[index].source,camera:frames[index].camera,sync:frames[index].sync,rating:$('rating').value,note:$('note').value};try{localStorage.setItem(reviewKey,JSON.stringify(reviews))}catch(e){$('status').textContent='暂存失败，请导出检查记录'}}$('rating').onchange=$('note').onchange=record;
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
$('saveReview').onclick=()=>{record();const url=URL.createObjectURL(new Blob([JSON.stringify({dataset:D.dataset,reviews},null,2)],{type:'application/json'}));download(url,'mesh_label_review.json');setTimeout(()=>URL.revokeObjectURL(url),1000)};$('shot').onclick=()=>{if(!img)return;try{download($('overlay').toDataURL(),'mesh_'+frames[index].camera+'_sync'+frames[index].sync+'.png')}catch(e){$('status').textContent='浏览器限制了本地截图，请用说明中的本地 HTTP 启动方式'}};
window.onresize=resize;resize();selectFrames();
</script><style id="viewerControlsStyle">.panel-controls{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.panel-controls button{padding:5px 8px;font-size:12px}.views.focus-mode{grid-template-columns:1fr!important}.views.focus-mode>.panel:not(.focus-selected){display:none}.views.focus-mode canvas{height:75vh}.panel:fullscreen{width:100vw;height:100vh;background:#070f17;border-radius:0}.panel:fullscreen canvas{height:calc(100vh - 90px);width:100%}.panel:fullscreen h2{min-height:70px}.panel:fullscreen .panel-controls button{font-size:15px}</style><script id="viewerControlsScript">/* Shared playback, magnification and fullscreen controls. No fitting changes. */
var viewInitialized=false;
let playing=false,playTimer=null,focusedCanvas=null;
function activeViewCanvas(){return document.fullscreenElement?.querySelector('canvas')||focusedCanvas||canvases[0]}
const controlBar=document.createElement('div');controlBar.className='bar';controlBar.id='playbackControls';
controlBar.innerHTML='<button id="playToggle">▶ 播放</button><label>采样帧播放速度 <select id="playRate"><option value="1">1 帧/秒</option><option value="2">2 帧/秒</option><option value="3.75" selected>3.75 帧/秒</option><option value="7.5">7.5 帧/秒</option></select></label><label><input type="checkbox" id="playLoop" checked>循环</label><label><input type="checkbox" id="keepZoom" checked>逐帧保持缩放</label><button id="zoomIn">＋ 放大</button><button id="zoomOut">－ 缩小</button><button id="restorePanels">恢复并排</button><span>播放当前采样帧，不是原始连续视频；P 键播放/暂停。</span>';
document.querySelector('.views').before(controlBar);
function setPlayLabels(){document.querySelectorAll('[data-play-button],#playToggle').forEach(b=>b.textContent=playing?'⏸ 暂停':'▶ 播放')}
function stopPlayback(){playing=false;clearTimeout(playTimer);playTimer=null;setPlayLabels()}
function schedulePlayback(){clearTimeout(playTimer);if(playing)playTimer=setTimeout(playStep,1000/Number($('playRate').value))}
function playStep(){if(!playing)return;if(!frames.length){stopPlayback();return}if(img){if(index>=frames.length-1){if(!$('playLoop').checked){stopPlayback();return}index=0;load()}else move(1)}schedulePlayback()}
function togglePlayback(){if(playing){stopPlayback();return}if(!frames.length)return;playing=true;setPlayLabels();schedulePlayback()}
function zoomView(factor){if(!img)return;const c=activeViewCanvas(),x=c.clientWidth/2,y=c.clientHeight/2,s=Math.max(.03,Math.min(30,scale*factor));ox=x-(x-ox)*s/scale;oy=y-(y-oy)*s/scale;scale=s;draw()}
function focusPanel(c){focusedCanvas=focusedCanvas===c?null:c;const views=document.querySelector('.views');views.classList.toggle('focus-mode',!!focusedCanvas);canvases.forEach(v=>v.closest('.panel').classList.toggle('focus-selected',v===focusedCanvas));resize();setPanelLabels()}
function setPanelLabels(){canvases.forEach(c=>{const b=c.closest('.panel').querySelector('[data-focus-button]');if(b)b.textContent=c===focusedCanvas?'恢复并排':'单独放大'})}
$('playToggle').onclick=togglePlayback;$('playRate').onchange=schedulePlayback;$('zoomIn').onclick=()=>zoomView(1.3);$('zoomOut').onclick=()=>zoomView(1/1.3);$('restorePanels').onclick=()=>{if(focusedCanvas)focusPanel(focusedCanvas)};
for(const c of canvases){const panel=c.closest('.panel'),bar=document.createElement('span');bar.className='panel-controls';const make=(text,fn)=>{const b=document.createElement('button');b.textContent=text;b.onclick=fn;bar.append(b);return b};make('单独放大',()=>focusPanel(c)).dataset.focusButton='';make('全屏',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await panel.requestFullscreen()}catch(e){$('status').textContent='浏览器未允许全屏，可使用“单独放大”'}});make('▶ 播放',togglePlayback).dataset.playButton='';make('＋',()=>zoomView(1.3));make('－',()=>zoomView(1/1.3));panel.querySelector('h2').append(bar)}
for(const id of ['prev','next','timeline','camera','source']){const e=$(id),event=id==='timeline'?'oninput':id==='camera'||id==='source'?'onchange':'onclick',old=e[event];e[event]=function(ev){stopPlayback();if(id==='camera'||id==='source')viewInitialized=false;return old?.call(this,ev)}}
document.addEventListener('fullscreenchange',()=>{resize();setPlayLabels()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayback()});window.addEventListener('keydown',e=>{if(e.code==='KeyP'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();togglePlayback()}});
// Failed image loads must not leave a hidden infinite playback timer running.
const previousStatus=$('status');new MutationObserver(()=>{if(previousStatus.textContent.includes('无法加载'))stopPlayback()}).observe(previousStatus,{childList:true});
</script></html>
