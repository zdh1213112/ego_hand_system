<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOKOV 骨架原图核查</title><style>*{box-sizing:border-box}body{margin:0;background:#102231;color:#e6f3ff;font:16px system-ui}header{padding:18px 22px;background:#1c394f}h1{font-size:24px;margin:0 0 8px}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 20px}button,select{font:inherit;padding:7px;border:0;border-radius:5px;background:#e2eff8;color:#16354b}label{display:inline-flex;align-items:center;gap:5px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}canvas{width:100%;height:68vh;background:#050e16;touch-action:none}.panel h2{font-size:16px;margin:10px}#status{padding:12px 20px;line-height:1.7;color:#8ae7c7}a{color:#90d7ff}.panel:fullscreen{background:#102231;width:100vw;height:100vh}.panel:fullscreen canvas{height:90vh}@media(max-width:850px){.views{grid-template-columns:1fr}canvas{height:45vh}}</style>
<header><h1>NOKOV 骨架核查 · 原始投影</h1><div><span style="color:#f45cf4">紫色：SDK 26 段骨架原点与父子连线</span>；<span style="color:#64ff89">绿色：24 个原始 marker</span>；青色／橙色：当前左右手 MANO 关节点。使用已有同步和真实 KB 相机标定，没有为骨架重新对齐或拟合。</div></header>
<div class="bar"><label>相机 <select id="camera"></select></label><label>手 <select id="hand"><option value="1">右手</option><option value="0">左手</option></select></label><button id="prev">上一帧</button><button id="next">下一帧</button><input type="range" id="timeline" min="0" style="flex:1"><span id="frame"></span></div>
<div class="bar"><label><input id="skeleton" type="checkbox" checked>SDK 骨架</label><label><input id="markers" type="checkbox" checked>原始 marker</label><label><input id="mano" type="checkbox">当前 MANO 骨架</label><label><input id="labels" type="checkbox">SDK 节点编号</label><button id="fit">放大当前手</button><button id="whole">整图</button><button id="play">播放样本</button><button id="full">右侧全屏</button><a id="snapshot" href="comparisons/camera0_000632.jpg">查看三栏静态对照</a></div>
<div class="views"><section class="panel"><h2>真实相机原图</h2><canvas id="raw"></canvas></section><section class="panel"><h2>SDK 骨架／marker／MANO 对照</h2><canvas id="overlay"></canvas></section></div><div id="status"></div>
<div class="bar">滚轮缩放、拖动平移，两栏同步。播放为预选样本，不是连续录制视频。骨骼段名称／编号不代表已确认的解剖学关节。<a href="../report.json">数值检查报告</a></div>
<script src="data.js"></script><script>
const D=window.SKELETON_AUDIT,$=x=>document.getElementById(x),canvases=[$('raw'),$('overlay')];let records=[],i=0,img=null,scale=1,ox=0,oy=0,token=0,drag=null,timer=null;for(const c of [...new Set(D.records.map(r=>r.camera))])$('camera').add(new Option(c,c));
function current(){return records[i]}function selected(){return current()?.hands.find(h=>h.side===+$('hand').value)}
function draw(){for(let k=0;k<2;k++){const c=canvases[k],x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);if(!img)continue;x.setTransform(devicePixelRatio*scale,0,0,devicePixelRatio*scale,devicePixelRatio*ox,devicePixelRatio*oy);x.drawImage(img,0,0);if(!k)continue;const h=selected();if(!h)continue;function lines(points,edges,valid,color){x.strokeStyle=color;x.fillStyle=color;x.lineWidth=1.7/scale;for(const [a,b] of edges){if(!valid[a]||!valid[b])continue;x.beginPath();x.moveTo(...points[a]);x.lineTo(...points[b]);x.stroke()}for(let j=0;j<points.length;j++){if(!valid[j])continue;const p=points[j];x.beginPath();x.arc(...p,3/scale,0,Math.PI*2);x.fill();if($('labels').checked&&color==='#f45cf4'){x.font=`${12/scale}px sans-serif`;x.fillText(j+1,p[0]+4/scale,p[1])}}}if($('skeleton').checked)lines(h.skeleton,h.edges,h.skeleton_valid,'#f45cf4');if($('mano').checked)lines(h.mano,D.mano_edges,h.mano_valid,h.side?'#ffad38':'#40e2dd');if($('markers').checked){x.strokeStyle='#64ff89';x.lineWidth=1.8/scale;for(let j=0;j<h.markers.length;j++){if(!h.marker_valid[j])continue;x.beginPath();x.arc(...h.markers[j],4.7/scale,0,Math.PI*2);x.stroke()}}}}
function fit(all=false){if(!img)return;const c=document.fullscreenElement?.querySelector('canvas')||canvases[0],b=all?[0,0,img.naturalWidth,img.naturalHeight]:selected().bbox;scale=.9*Math.min(c.clientWidth/(b[2]-b[0]),c.clientHeight/(b[3]-b[1]));ox=c.clientWidth/2-(b[0]+b[2])/2*scale;oy=c.clientHeight/2-(b[1]+b[3])/2*scale;draw()}
function load(){const seq=++token;img=null;draw();const r=current();if(!r){$('status').textContent='无可用样本';return}$('timeline').value=i;$('frame').textContent=`${i+1}/${records.length} · sync ${r.sync}`;$('status').textContent=`${r.camera} · sync ${r.sync} · ${+$('hand').value?'右手':'左手'} · 紫色骨架未经过图像校正；不能据此把 SDK 节点认作真实内部关节。`;$('snapshot').href='comparisons/'+r.camera+'_'+String(r.sync).padStart(6,'0')+'.jpg';$('snapshot').style.display=[576,632,664,688].includes(r.sync)?'':'none';const im=new Image();im.onload=()=>{if(seq!==token)return;img=im;fit()};im.onerror=()=>{$('status').textContent='原图加载失败'};im.src=r.image}
function select(keep=632){records=D.records.filter(r=>r.camera===$('camera').value).sort((a,b)=>a.sync-b.sync);i=records.reduce((a,r,k)=>Math.abs(r.sync-keep)<Math.abs(records[a].sync-keep)?k:a,0);$('timeline').max=records.length-1;load()}function resize(){for(const c of canvases){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}if(img)fit()}
$('camera').onchange=()=>select(current()?.sync);$('hand').onchange=load;$('prev').onclick=()=>{i=(i-1+records.length)%records.length;load()};$('next').onclick=()=>{i=(i+1)%records.length;load()};$('timeline').oninput=e=>{i=+e.target.value;load()};for(const k of ['skeleton','markers','mano','labels'])$(k).onchange=draw;$('fit').onclick=()=>fit();$('whole').onclick=()=>fit(true);$('full').onclick=()=>canvases[1].closest('.panel').requestFullscreen();document.addEventListener('fullscreenchange',resize);$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放样本'}else{timer=setInterval(()=>{$('next').click()},1200);$('play').textContent='暂停'}};
for(const c of canvases){c.onwheel=e=>{e.preventDefault();const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,s=scale*Math.exp(-e.deltaY*.001);ox=x-(x-ox)*s/scale;oy=y-(y-oy)*s/scale;scale=s;draw()};c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;ox+=e.clientX-drag[0];oy+=e.clientY-drag[1];drag=[e.clientX,e.clientY];draw()};c.onpointerup=c.onpointercancel=()=>drag=null}window.onresize=resize;resize();select();
</script></html>
