<!doctype html><html lang="zh"><meta charset="utf-8"><title>实际优化轮廓检查</title><style>*{box-sizing:border-box}body{background:#112433;color:#e6f0f7;font:15px system-ui;margin:0}header{padding:18px 24px;background:#1e3a4d}h1{font-size:23px;margin:0 0 8px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:10px 20px}button,select,input{font:inherit}button,select{padding:7px 10px;border:0;border-radius:6px;background:#e1eef6;color:#143147;cursor:pointer}label{display:inline-flex;align-items:center;gap:5px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}.panel{background:#07121b;border-radius:8px;overflow:hidden}.panel h2{font-size:15px;margin:0;padding:10px}canvas{width:100%;height:62vh;display:block;touch-action:none}.focus{grid-template-columns:1fr}.focus .panel:not(.selected){display:none}.focus canvas{height:76vh}.panel:fullscreen{height:100vh;width:100vw}.panel:fullscreen canvas{height:calc(100vh - 85px);width:100vw}.controls{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 7px}.controls button{font-size:12px;padding:4px 7px}#status,#report,#review{padding:12px 20px;line-height:1.7}#status{color:#8be6c5}.muted{color:#b5c9d7}a{color:#85d8ff}input[type=range]{accent-color:#e648d4}textarea{width:360px;max-width:100%;height:45px;font:inherit}#timeline{flex:1;min-width:130px}@media(max-width:850px){.views{grid-template-columns:1fr}canvas{height:47vh}}</style>
<header><h1>实际优化轮廓检查 · CONTOUR-AUDIT-1</h1><div>左侧原图，右侧分割区域与实际轮廓点。<span style="color:#69ef74">绿色：分割区域／外边界</span>；<span style="color:#ff65e7">紫色：真正送入优化的轮廓点</span>。绿色区域可能包含袖口；只有紫色点参与轮廓损失。本页不显示 MANO 网格。</div></header>
<div class="bar"><label>相机 <select id="camera"></select></label><label>手 <select id="hand"><option value="1">右手</option><option value="0">左手</option></select></label><label>样本 <select id="filter"><option value="used">参与本轮联合优化</option><option value="accepted">全部接受的轮廓</option><option value="rejected">被剔除的样本</option><option value="all">全部样本</option></select></label><button id="prev">上一帧</button><button id="next">下一帧</button><input id="timeline" type="range" min="0"><span id="frameText"></span></div>
<div class="bar"><button id="play">播放采样帧</button><label>速度 <select id="rate"><option value="1">1 帧/秒</option><option value="2" selected>2 帧/秒</option><option value="3.75">3.75 帧/秒</option></select></label><label><input id="points" type="checkbox" checked>实际轮廓点</label><label><input id="boundary" type="checkbox">分割外边界</label><label><input id="mask" type="checkbox" checked>分割区域</label><label>区域透明度 <input id="alpha" type="range" min="0" max=".8" step=".05" value=".25" style="width:100px"></label><button id="fit">放大当前手</button><button id="allImage">整图</button><button id="shot">保存叠加截图</button></div>
<div class="views" id="views"><section class="panel"><h2>原始相机画面</h2><div class="controls"></div><canvas id="raw"></canvas></section><section class="panel"><h2>自动分割＋实际约束点</h2><div class="controls"></div><canvas id="overlay"></canvas></section></div>
<div id="status"></div><div id="review"><label>此轮廓检查 <select id="rating"><option value="unreviewed">未检查</option><option value="good">轮廓正确</option><option value="missing_fingers">漏掉手指／边缘</option><option value="background">包含背景</option><option value="merged_hands">双手粘连</option><option value="wrong_hand">左右手／身份错误</option><option value="uncertain">看不清</option></select></label> <textarea id="note" placeholder="可选备注"></textarea> <button id="export">导出检查记录</button><p class="muted">滚轮缩放，拖动平移；两栏同步。空格暂时隐藏叠加，P 播放／暂停。播放的是采样图；切换相机时定位到最接近的实际可用帧。</p></div><div id="report"></div>
<script src="data.js"></script><script>
const D=window.CONTOUR_AUDIT,$=id=>document.getElementById(id),cs=[$('raw'),$('overlay')];let frames=[],i=0,img=null,maskImage=null,scale=1,ox=0,oy=0,seq=0,drag=null,playing=false,timer=null,focus=null,hidden=false;const reviewKey='contour-audit:'+D.report.observations;let reviews={};try{reviews=JSON.parse(localStorage.getItem(reviewKey)||'{}')}catch(e){}
const reasons={both_hands_share_component:'两手落入同一连通区域',partial_or_behind_camera:'出画／深度无效',oversized_component:'连接到过大区域，疑似背景',unstable_color_boundary:'颜色阈值变化时边界不稳定',insufficient_mesh_boundary:'模型初始边界不足',external_mesh_boundary_insufficient:'模型外边界不足',too_few_marker_component_matches:'无法匹配足够 marker 提示',insufficient_distal_contour:'腕部远端轮廓不足',component_too_small:'连通区域过小',no_contour:'没有轮廓',hand_too_small:'手部区域过小'};
for(const c of [...new Set(D.records.map(r=>r.camera))])$('camera').add(new Option(c,c));function current(){return frames[i]}function key(){const f=current();return f?`${f.camera}/${f.sync}/${f.side}`:''}function stop(){playing=false;clearTimeout(timer);$('play').textContent='播放采样帧'}function draw(){for(let n=0;n<2;n++){const c=cs[n],x=c.getContext('2d'),r=devicePixelRatio;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);if(!img)continue;x.setTransform(r*scale,0,0,r*scale,r*ox,r*oy);x.drawImage(img,0,0);if(!n||hidden)continue;const f=current();if($('mask').checked&&maskImage){x.globalAlpha=+$('alpha').value;x.drawImage(maskImage,0,0);x.globalAlpha=1}if($('boundary').checked){x.strokeStyle='#64f076';x.lineWidth=1.3/scale;for(const line of f.external_boundary){if(!line.length)continue;x.beginPath();x.moveTo(...line[0]);for(const p of line.slice(1))x.lineTo(...p);x.closePath();x.stroke()}}if($('points').checked){x.fillStyle='#ff58df';for(const p of f.points){x.beginPath();x.arc(p[0],p[1],2.3/scale,0,Math.PI*2);x.fill()}}}}
function active(){return document.fullscreenElement?.querySelector('canvas')||focus||cs[0]}function fit(all=false){if(!img)return;const c=active(),b=all?[0,0,img.naturalWidth,img.naturalHeight]:current().bbox;scale=.93*Math.min(c.clientWidth/Math.max(1,b[2]-b[0]),c.clientHeight/Math.max(1,b[3]-b[1]));ox=c.clientWidth/2-(b[0]+b[2])/2*scale;oy=c.clientHeight/2-(b[1]+b[3])/2*scale;draw()}function resize(){for(const c of cs){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}if(img)fit();else draw()}
function load(){const token=++seq;img=null;maskImage=null;draw();const f=current();if(!f){$('status').textContent='当前筛选没有样本；请切换相机、手或样本范围。';$('frameText').textContent='0 / 0';return}$('timeline').value=i;$('frameText').textContent=`${i+1}/${frames.length} · sync ${f.sync}`;const n=reviews[key()];$('rating').value=n?.rating||'unreviewed';$('note').value=n?.note||'';let text=`${f.camera} · sync ${f.sync} · ${f.side?'右手':'左手'} · `;text+=f.accepted?`${f.points.length} 个实际轮廓点 · ${f.used_in_joint_fit?'参与联合优化':'接受但未参与本轮联合优化'} · ${f.replay_exact?'原始分割重放与实际输入逐点一致':'重放未通过一致性检查，紫点仍为实际输入'}`:'被剔除：'+(reasons[f.reason]||f.reason);if(f.known_issue)text+=' · 已发现问题：'+f.known_issue;$('status').textContent=text;const image=new Image();image.onload=()=>{if(token!==seq)return;img=image;fit()};image.src=f.image;if(f.mask){const m=new Image();m.onload=()=>{if(token!==seq)return;maskImage=m;draw()};m.src=f.mask}}
function select(keep=632){const mode=$('filter').value;frames=D.records.filter(f=>f.camera===$('camera').value&&f.side===+$('hand').value&&(mode==='all'||mode==='used'&&f.used_in_joint_fit||mode==='accepted'&&f.accepted||mode==='rejected'&&!f.accepted)).sort((a,b)=>a.sync-b.sync);i=frames.length?frames.reduce((a,f,k)=>Math.abs(f.sync-keep)<Math.abs(frames[a].sync-keep)?k:a,0):0;$('timeline').max=Math.max(0,frames.length-1);load()}function move(d){if(!frames.length)return;i=Math.max(0,Math.min(frames.length-1,i+d));load()}function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{if(img&&frames.length){i=(i+1)%frames.length;load()}schedule()},1000/+$('rate').value)}
$('camera').onchange=$('hand').onchange=$('filter').onchange=()=>{stop();select(current()?.sync??632)};$('prev').onclick=()=>{stop();move(-1)};$('next').onclick=()=>{stop();move(1)};$('timeline').oninput=e=>{stop();i=+e.target.value;load()};$('play').onclick=()=>{if(playing)stop();else if(frames.length){playing=true;$('play').textContent='暂停';schedule()}};$('rate').onchange=schedule;for(const id of ['mask','boundary','points','alpha'])$(id).oninput=draw;$('fit').onclick=()=>fit();$('allImage').onclick=()=>fit(true);
for(const c of cs){c.onwheel=e=>{e.preventDefault();const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,s=Math.max(.03,Math.min(30,scale*Math.exp(-e.deltaY*.001)));ox=x-(x-ox)*s/scale;oy=y-(y-oy)*s/scale;scale=s;draw()};c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;ox+=e.clientX-drag[0];oy+=e.clientY-drag[1];drag=[e.clientX,e.clientY];draw()};c.onpointerup=c.onpointercancel=()=>drag=null;const bar=c.closest('.panel').querySelector('.controls');function button(title,fn){const b=document.createElement('button');b.textContent=title;b.onclick=fn;bar.append(b)}button('单独放大',()=>{focus=focus===c?null:c;$('views').classList.toggle('focus',!!focus);for(const p of cs)p.closest('.panel').classList.toggle('selected',p===focus);resize()});button('全屏',()=>c.closest('.panel').requestFullscreen().catch(e=>$('status').textContent=e.message));button('播放／暂停',()=>$('play').click())}
function save(){if(!current())return;reviews[key()]={camera:current().camera,sync:current().sync,side:current().side,accepted:current().accepted,used_in_joint_fit:current().used_in_joint_fit,rating:$('rating').value,note:$('note').value};try{localStorage.setItem(reviewKey,JSON.stringify(reviews))}catch(e){$('status').textContent+='；本机暂存失败，请导出记录'}}$('rating').onchange=$('note').onchange=save;function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}$('export').onclick=()=>{save();const u=URL.createObjectURL(new Blob([JSON.stringify({schema:'contour_visual_review_v1',observations:D.report.observations,records:Object.values(reviews)},null,2)],{type:'application/json'}));download(u,'contour_visual_review.json');setTimeout(()=>URL.revokeObjectURL(u),1000)};$('shot').onclick=()=>{if(img)download($('overlay').toDataURL(),'contour_'+current().camera+'_'+current().sync+'_'+current().side+'.png')};window.onresize=resize;document.addEventListener('fullscreenchange',resize);window.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();hidden=true;draw()}if(e.code==='KeyP')$('play').click()};window.onkeyup=e=>{if(e.code==='Space'){hidden=false;draw()}};window.onblur=()=>{hidden=false;draw()};
$('report').textContent=`总计：${D.report.original_images} 张原图，接受 ${D.report.accepted} 份手轮廓，剔除 ${D.report.rejected} 份；${D.report.used_in_joint_fit} 份实际进入联合优化。绿色区域由原视频确定性重放；${D.report.replay_exact_count} 份接受样本逐点一致，${D.report.replay_mismatch_count} 份不一致。没有在腕部裁剪处或缺失点之间补画“实际轮廓”连线。`;if(!D.report.used_in_joint_fit)$('filter').value='accepted';resize();select();
</script></html>
